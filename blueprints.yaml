name: Basalt
slug: basalt
type: theme
version: 0.10.0
description: A modular Bootstrap 5 base theme for Grav 2
icon: cube

author:
  name: Norbert Morajda
  email: n.morajda@abmstudio.pl
  url: https://abmstudio.pl

homepage: https://github.com/nmorajda/grav-theme-basalt
bugs: https://github.com/nmorajda/grav-theme-basalt/issues
readme: https://github.com/nmorajda/grav-theme-basalt/blob/master/README.md
license: MIT

keywords: grav, theme, bootstrap, bootstrap5, scss, gulp, base-theme, accessibility

compatibility:
  grav: ['2.0']

dependencies:
  - name: grav
    version: '>=2.0.0'

form:
  validation: loose

  fields:
    tabs:
      type: tabs
      active: 1

      fields:
        general:
          type: tab
          title: General

          fields:
            icons.enabled:
              type: toggle
              label: Enable Bootstrap Icons
              help: Load the local Bootstrap Icons stylesheet and font files.
              highlight: 1
              default: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
              validate:
                type: bool
            favicon_settings:
              type: section
              title: Favicon
              underline: true

              fields:
                favicon.custom:
                  type: file
                  label: Custom Favicon
                  help: Upload a PNG favicon (recommended 180 x 180 px or larger). Leave empty to use the default Basalt icons.
                  destination: 'user://images/favicon'
                  multiple: false
                  random_name: true
                  filesize: 1
                  accept:
                    - .png
        navbar:
          type: tab
          title: Navbar

          fields:
            navbar_settings:
              type: section
              title: Navbar settings
              underline: true

              fields:
                navbar.enabled:
                  type: toggle
                  label: Enable navbar
                  highlight: 1
                  default: 1
                  options:
                    1: PLUGIN_ADMIN.ENABLED
                    0: PLUGIN_ADMIN.DISABLED
                  validate:
                    type: bool

                navbar.expand:
                  type: select
                  label: Navbar expansion breakpoint
                  help: Expand the navbar from the selected Bootstrap breakpoint.
                  default: lg
                  options:
                    sm: Small
                    md: Medium
                    lg: Large
                    xl: Extra large
                    xxl: Extra extra large
                  validate:
                    type: string

            navbar_dropdown:
              type: section
              title: Dropdown navigation
              underline: true

              fields:
                dropdown.enabled:
                  type: toggle
                  label: Enable dropdown navigation
                  highlight: 1
                  default: 1
                  options:
                    1: PLUGIN_ADMIN.ENABLED
                    0: PLUGIN_ADMIN.DISABLED
                  validate:
                    type: bool

                navbar.dropdown.trigger:
                  type: select
                  label: Default dropdown trigger
                  help: Select how parent navigation items with children open their submenu.
                  default: standard
                  options:
                    standard: Standard
                    split: Split
                  validate:
                    type: string
            navbar_integrations:
              type: section
              title: Integrations
              underline: true

              fields:
                navbar.language_switcher.enabled:
                  type: toggle
                  label: Enable language switcher
                  help: Show the LangSwitcher integration when the plugin is enabled.
                  highlight: 1
                  default: 1
                  options:
                    1: PLUGIN_ADMIN.ENABLED
                    0: PLUGIN_ADMIN.DISABLED
                  validate:
                    type: bool

                navbar.search.enabled:
                  type: toggle
                  label: Enable navbar search
                  help: Show the SimpleSearch integration when the plugin is enabled.
                  highlight: 1
                  default: 1
                  options:
                    1: PLUGIN_ADMIN.ENABLED
                    0: PLUGIN_ADMIN.DISABLED
                  validate:
                    type: bool

            navbar_cta:
              type: section
              title: Call to action
              underline: true

              fields:
                navbar.cta.enabled:
                  type: toggle
                  label: Enable navbar CTA
                  help: Show the content-driven call to action when its page exists.
                  highlight: 1
                  default: 1
                  options:
                    1: PLUGIN_ADMIN.ENABLED
                    0: PLUGIN_ADMIN.DISABLED
                  validate:
                    type: bool
